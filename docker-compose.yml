services:
  tidemarq:
    image: ghcr.io/puckrin/tidemarq:latest
    ports:
      - "8716:8716"
      - "8717:8717"
    volumes:
      # Persistent application data: database, TLS certs, JWT secret, version history, quarantine.
      - ./data:/data

      # Add bind mounts below to expose host directories to tidemarq as local filesystem paths.
      # These paths will be browsable and selectable as job sources or destinations in the UI.
      # Format: /host/path:/container/path
      # Append :ro to make a mount read-only (recommended for source-only directories).
      #
      # Examples:
      #   - /srv/media:/mnt/media
      #   - /srv/documents:/mnt/documents:ro
      #   - /srv/backups:/mnt/backups

    restart: unless-stopped

    # The default admin account is created on first start with username `admin`
    # and password `admin123`. Log in at https://localhost:8717 and change the
    # password immediately via Settings → Users.
    #
    # For advanced configuration (custom ports, bring-your-own TLS certificate,
    # stable JWT secret), mount tidemarq.example.yaml from
    # https://github.com/puckrin/tidemarq/blob/main/tidemarq.example.yaml and
    # add an `environment:` block pointing at it, e.g.:
    #
    # environment:
    #   - TIDEMARQ_CONFIG=/etc/tidemarq/tidemarq.yaml
